<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--CSP-->
  <title>ErrorBuddy</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <div id="toasts" aria-live="polite"></div>

  <header class="header">
    <label class="sr-only" for="personality">Personality</label>
    <select id="personality" title="Pick who reacts to your errors">
      <option value="random">Random</option>
      <option value="pirate">Pirate</option>
      <option value="sportscaster">Sportscaster</option>
      <option value="parent">Disappointed Parent</option>
      <option value="shakespeare">Shakespeare</option>
      <option value="narrator">Nature Narrator</option>
    </select>
    <div id="streak" class="streak" title="Fixes in a row">
      <span class="icon-slot" data-icon="flame"></span><span id="streakCount">0</span> in a row
    </div>
  </header>

  <main id="scene" class="scene is-idle">
    <div id="legendaryBanner" class="legendary-banner" hidden>
      <span class="icon-slot" data-icon="bolt"></span>
      <span>LEGENDARY ERROR</span>
      <span class="icon-slot" data-icon="bolt"></span>
    </div>

    <section class="character">
      <div id="avatar" class="avatar" aria-hidden="true"></div>
      <div class="speech">
        <div id="errorMeta" class="error-meta" hidden></div>
        <div class="bubble" aria-live="polite">
          <p id="bubbleText" class="bubble-text">No errors. Suspiciously quiet…</p>
          <p id="idleHint" class="hint">Keep coding. I'll speak up the moment something breaks.</p>
          <div id="typing" class="typing" hidden aria-label="Thinking">
            <span></span><span></span><span></span>
          </div>
        </div>
      </div>
    </section>

    <div id="skeleton" class="skeleton" hidden aria-hidden="true">
      <span class="sk sk-title"></span>
      <span class="sk"></span>
      <span class="sk sk-short"></span>
      <span class="sk sk-title sk-gap"></span>
      <span class="sk"></span>
      <span class="sk sk-button"></span>
    </div>

    <section id="explainBox" class="block" hidden>
      <h2>What happened</h2>
      <p id="explanation"></p>
    </section>

    <section id="fixBox" class="block" hidden>
      <h2>How to fix it</h2>
      <ol id="fixList"></ol>
      <button id="jumpBtn" type="button">Go to line</button>
    </section>
  </main>

  <div id="mockBar" class="mock-bar" hidden>
    <span>Mock mode</span>
    <button id="mockTheme" class="quiet" type="button">Toggle light / dark</button>
  </div>

  <script src="pixels.js"></script>
  <script src="confetti.js"></script>
  <script src="panel.js"></script>
</body>
</html>
