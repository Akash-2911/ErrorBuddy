<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--CSP-->
  <title>ErrorBuddy</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <div id="toasts" aria-live="polite"></div>

  <header class="header">
    <label class="sr-only" for="personality">Personality</label>
    <select id="personality" title="Pick who reacts to your errors">
      <option value="random">🎲 Random</option>
      <option value="pirate">🏴‍☠️ Pirate</option>
      <option value="sportscaster">🎙️ Sportscaster</option>
      <option value="parent">😔 Disappointed Parent</option>
      <option value="shakespeare">🎭 Shakespeare</option>
      <option value="narrator">🦎 Nature Narrator</option>
    </select>
    <div id="streak" class="streak" title="Fixes in a row">🔥 <span id="streakCount">0</span> in a row</div>
    <button id="profileBtn" class="icon-btn" type="button" title="Your profile" aria-label="Your profile" aria-expanded="false">👤</button>
  </header>

  <main id="scene" class="scene is-idle">
    <div id="legendaryBanner" class="legendary-banner" hidden>⚡ LEGENDARY ERROR ⚡</div>

    <section class="character">
      <div id="avatar" class="avatar" aria-hidden="true">😌</div>
      <div class="bubble" aria-live="polite">
        <p id="bubbleText" class="bubble-text">No errors. Suspiciously quiet…</p>
        <div id="typing" class="typing" hidden aria-label="Thinking">
          <span></span><span></span><span></span>
        </div>
      </div>
      <div id="errorMeta" class="error-meta" hidden></div>
    </section>

    <section id="explainBox" class="box" hidden>
      <h2>🤔 What happened</h2>
      <p id="explanation"></p>
    </section>

    <section id="fixBox" class="box" hidden>
      <h2>🔧 How to fix it</h2>
      <ol id="fixList"></ol>
      <button id="jumpBtn" type="button">Go to line</button>
    </section>
  </main>

  <section id="profile" class="profile" hidden>
    <button id="profileBack" class="link-btn" type="button">← Back</button>

    <div class="profile-card">
      <div id="profileInitial" class="profile-avatar" aria-hidden="true">?</div>
      <div id="nameView" class="name-view">
        <div id="profileName" class="profile-name"></div>
        <button id="editName" class="link-btn" type="button">✏️ Edit name</button>
      </div>
      <form id="nameForm" class="name-form" hidden>
        <label class="sr-only" for="nameInput">Username</label>
        <input id="nameInput" type="text" maxlength="30" autocomplete="off" spellcheck="false">
        <div class="name-actions">
          <button type="submit">Save</button>
          <button id="cancelName" class="secondary" type="button">Cancel</button>
        </div>
        <p class="hint">Leave it empty to use your computer's login name.</p>
      </form>
    </div>

    <div class="stats">
      <div class="stat"><div id="statStreak" class="stat-value">0</div><div class="stat-label">Streak</div></div>
      <div class="stat"><div id="statBest" class="stat-value">0</div><div class="stat-label">Best streak</div></div>
      <div class="stat"><div id="statFixes" class="stat-value">0</div><div class="stat-label">Total fixes</div></div>
    </div>

    <section class="box">
      <h2>🏆 Achievements <span id="achCount" class="ach-count"></span></h2>
      <ul id="achList" class="ach-list"></ul>
    </section>
  </section>

  <div id="mockBar" class="mock-bar" hidden>
    <span>Mock mode</span>
    <button id="mockTheme" type="button">Toggle light / dark</button>
  </div>

  <script src="confetti.js"></script>
  <script src="panel.js"></script>
</body>
</html>
